<!DOCTYPE html>
<html>

<head>
    <title>My Website created by Omer Faruk Yildiz With HTML and CSS</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: black;
        }

        p,
        h1,
        h2 {
            color: white;
        }

        /* kutu genişlikleri */
        .col-1 {
            width: 8.33%;
        }

        .col-2 {
            width: 16.66%;
        }

        .col-3 {
            width: 25%;
        }

        .col-4 {
            width: 33.33%;
        }

        .col-5 {
            width: 41.66%;
        }

        .col-6 {
            width: 50%;
        }

        .col-7 {
            width: 58.33%;
        }

        .col-8 {
            width: 66.66%;
        }

        .col-9 {
            width: 75%;
        }

        .col-10 {
            width: 83.33%;
        }

        .col-11 {
            width: 91.66%;
        }

        .col-12 {
            width: 100%;
        }

        /* col- ile uygulanmış HTML komutlarını seç */
        [class*="col-"] {
            float: left;
            padding: 15px;
            border: 1px solid red;
        }

        /* satır içeriklerini temizleyip tablo gibi görünmesini sağlar */
        .row::after {
            content: "";
            clear: both;
            display: table;
        }

        /* 768px ve altındaki ekran boyutları için stil */
        @media only screen and (max-width: 768px) {
            [class*="col-"] {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div id="row1" class="row">
        <div id="logo" class="col-2">
            <img src="a1.jpg">
        </div>
        <div id="anamenu" class="col-10">
            <p>ANAMENU</p>
        </div>
    </div>

    <div id="row2" class="row">
        <div id="icerik" class="col-9">
            <p>ICERIK</p>
        </div>
        <div id="yanmenu" class="col-3">
            <p>YANMENU</p>
        </div>
    </div>

    <div id="row3" class="row">
        <div id="altsol" class="col-4">
            <p>ALTSOL</p>
        </div>
        <div id="altORTA" class="col-4">
            <p>ALTORTA</p>
        </div>
        <div id="altSAG" class="col-4">
            <p>ALTSAG</p>
        </div>
    </div>
</body>


</html>
