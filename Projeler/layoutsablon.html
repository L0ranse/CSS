<!DOCTYPE html>
<html>

<head>
    <title>My Website created by Omer Faruk Yildiz With HTML and CSS</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;

        }

        body {
            color: yellow;
            background-color: black;
        }

        #container {
            border: 3px solid rgb(242, 7, 246);
            width: 90%;
            margin: 0 auto;
        }

        #logo {
            width: 100px;
            height: 100px;
            background-color: springgreen;
        }

        #anamenu {
            border: 3px dashed firebrick;
            width: 100%;
            height: 50px;
            background-color: rgb(255, 0, 0);
        }

        #icerik {
            border: gold dotted 3px;
            width: 70%;
            min-height: 500px;
            background-color: gray;
            float: left;
        }

        #yanmenu {
            border: greenyellow solid 3px;
            width: 30%;
            min-height: 500px;
            background-color: indianred;
            float: left;
        }

        #altmenu {
            border: indigo dashed 3px;
            width: 100%;
            height: 50px;
            background-color: rgb(255, 255, 255);
            float: left;
        }
    </style>
</head>

<body>
    <div id="container">
        <header id="logo">
            <h1>Logo / Başlık</h1>
        </header>
        <nav id="anamenu">
            <ul>
                <li><a href="#">Ana Sayfa</a></li>
                <li><a href="#">Hakkında</a></li>
                <li><a href="#">Hizmetler</a></li>
                <li><a href="#">İletişim</a></li>
            </ul>
        </nav>
        <section id="icerik">
            <article>
                <h2>İçerik Başlığı</h2>
                <p>Ana içerik burada yer alacak.</p>
            </article>
        </section>
        <aside id="yanmenu">
            <h3>Yan Menü</h3>
            <ul>
                <li><a href="#">Link 1</a></li>
                <li><a href="#">Link 2</a></li>
                <li><a href="#">Link 3</a></li>
            </ul>
        </aside>
        <footer id="altmenu">
            <p>&copy; 2026 Ömer Faruk Yıldız. Tüm hakları saklıdır.</p>
        </footer>
    </div>

</body>

</html>
