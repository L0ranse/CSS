    <meta charset="UTF-8">

    <style>
        div {
            border-style: solid;
            border-width: 5px;
        }

        #buyuk {
            width: 300px;
            height: 200px;
            background-color: cornflowerblue;
            border-color: chocolate;
            padding: 20px;

        }

        #kucuk {
            width: 120px;
            height: 60px;
            background-color: darkgoldenrod;
            border-color: red;
            padding: 5px;
            position: absolute;
            bottom: 0px;
            left: 0px;
        }

        #bir {
            width: 200px;
            height: 150px;
            background-color: lightblue;
            border-style: solid;
            border-width: 3px;
            border-color: black;
            padding: 10px 20px;
            margin: 20px;
            position: relative;
            z-index: -1;
        }

        #iki {
            width: 150px;
            height: 100px;
            background-color: lightcoral;
            border-style: dashed;
            border-width: 2px;
            border-color: red;
            padding: 15px 10px;
            margin: 30px;
            margin-top: auto;
            position: relative;
            top : -50px;
            z-index: 1;
        }
    </style>
</head>
