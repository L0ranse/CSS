<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Form</title>
</head>
<style>
    #formkutusu {
        width: 400px;
        height: 200px;
        background-color: #bd1414;
        margin: 100px 100px;
        padding: 10px;
        border-radius: 30px;
    }

    table {
        width: 100%;
    }

    td {
        padding: 10px;
        color: white;
    }

    body {
        font-family: Arial, sans-serif;
        background-color: #e6e6e6;
    }

    #formkutusu input[type="text"],
    #formkutusu input[type="number"] {
        width: 100%;
        padding: 5px;
        border-radius: 5px;
        border: none;
    }

    input {
        border-radius: 5px;
        padding: 5px 10px;
        background-color: #ffffff;
        border: 1px solid #ccc;
        cursor: pointer;
        margin-right: 5px;
        margin-top: 10px;
        margin-bottom: 10px;
    }

    input:hover {
        background-color: #56e115;
    }
</style>

<body>
    <div id="formkutusu">
        <form>
            <table>
                <tr>
                    <td>Ad Soyad:</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>Yaş:</td>
                    <td><input type="number"></td>
                </tr>
                <tr>
                    <td></td>
                    <td>
                        <input type="submit">
                        <input type="reset">
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>

</html>
