<!DOCTYPE html>
<html>

<head>
    <title>My Website created by Omer Faruk Yildiz With HTML and CSS</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        #kutu {
            width: 100px;
            height: 100px;
            border: deeppink solid 3px;
            border-radius: 10px;
            /*Kutu kenarlarını yuvarlatır. */
            overflow: hidden;
            overflow: scroll;
            /*Taşan yazılar için kaydırma çubuğu ekler. */
            overflow: auto;
            /*Taşan yazılar için kaydırma çubuğu ekler, ancak sadece gerektiğinde gösterir. */
        }
    </style>
</head>

<body>
    <div id="kutu">
        <p>Merhaba, bu bir paragraf metnidir. Bu paragraf metninin yazılmasındaki amaç ise kutudan taşan yazılara nasıl
            komutlar uygulanacağıdır.</p>
    </div>
</body>

</html>
