    <style>
        ul {
            list-style-type: square;
            /* Liste öğelerinin başında kare simgesi kullanıyoruz */
            list-style-type: circle;
            /* Liste öğelerinin başında daire simgesi kullanıyoruz */

            /* Liste öğelerinin başında hiçbir simge kullanmıyoruz */

            /* Liste öğelerinin başında dolu daire simgesi kullanıyoruz */
            list-style-type: decimal;
            /* Liste öğelerinin başında numara kullanıyoruz */
            list-style-type: lower-alpha;
            /* Liste öğelerinin başında küçük harf kullanıyoruz */
            list-style-type: upper-alpha;
            /* Liste öğelerinin başında büyük harf kullanıyoruz */
            list-style-type: lower-roman;
            /* Liste öğelerinin başında küçük Roma rakamı kullanıyoruz */
            list-style-type: upper-roman;
            /* Liste öğelerinin başında büyük Roma rakamı kullanıyoruz */
        }
