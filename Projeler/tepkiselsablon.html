<!DOCTYPE html>
<html>

<head>
    <title>My Website created by Omer Faruk Yildiz With HTML and CSS</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: black;
        }

        p,
        h1,
        h2 {
            color: white;
        }

        /* kutu genişlikleri */
        .col-1 {
            width: 8.33%;
        }

        .col-2 {
            width: 16.66%;
        }

        .col-3 {
            width: 25%;
        }

        .col-4 {
            width: 33.33%;
        }

        .col-5 {
            width: 41.66%;
        }

        .col-6 {
            width: 50%;
        }

        .col-7 {
            width: 58.33%;
        }

        .col-8 {
            width: 66.66%;
        }

        .col-9 {
            width: 75%;
        }

        .col-10 {
            width: 83.33%;
        }

        .col-11 {
            width: 91.66%;
        }

        .col-12 {
            width: 100%;
        }

        /* col- ile uygulanmış HTML komutlarını seç */
        [class*="col-"] {
            float: left;
            padding: 15px;
            border: 1px solid red;
        }

        /* satır içeriklerini temizleyip tablo gibi görünmesini sağlar */
        .row::after {
            content: "";
            clear: both;
            display: table;
        }

        /* 768px ve altındaki ekran boyutları için stil */
        @media only screen and (max-width: 768px) {
            [class*="col-"] {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div id="row1" class="row">
        <div class="col-12">
            <h1>My Website</h1>
        </div>
    </div>
        <div class="row">
            <div class="col-12">
                <p>Welcome to my website!</p>
            </div>
        </div>
        <div class="row">
            <div class="col-6">
                <h2>About Me</h2>
                <p>This is a brief introduction about myself.</p>
            </div>
            <div class="col-6">
                <h2>Contact</h2>
                <p>You can reach me at my email address.</p>
            </div>
        </div>
    </div>
</body>

</html>
