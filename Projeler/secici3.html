<!DOCTYPE html>
<html>

<head>
    <style>
        p {
            color: blue;
        }

        #ilk {
            font-style: italic;
        }

        .times {
            font-family: 'Times New Roman', Times, serif;
        }

        p.times {
            color: brown;
        }

        h1.times {
            color: aqua;
        }

        h2.times {
            color: darkblue;
        }
    </style>
</head>

<body>
    <h1 class="times" id="ilk">Ana Başlık</h1>
    <h2 class="times">Yan Başlık</h2>
    <p class="times">Bu bir denemedir.</p>
</body>

</html>
