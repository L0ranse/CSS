<!DOCTYPE html>
<html>
    <head>
        <title>My Website created by Omer Faruk Yildiz With HTML and CSS</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            /* CSS kodlarınızı buraya ekleyebilirsiniz */
            #kutu {
                /* border: 2px solid black; */
                border-style: dashed; /* Kutu kenarlarını kesikli çizgi yapıyoruz */
                border-width: 3px; /* Kutu kenarlarının kalınlığını 3 piksel olarak ayarlıyoruz */
                border-color: red; /* Kutu kenarlarının rengini kırmızı yapıyoruz */
                /* border: dashed 3px red; tek satırda border ayarları */
                padding: 20px; /* Kutu içindeki metin ile kutu kenarları arasına 20 piksel boşluk ekliyoruz */
            }
        </style>
    </head>
    <body>
        <div id="kutu">
            <p>Merhaba, bu bir paragraf! Bu paragraf bir kutu içinde yer alıyor. Kutuyu css ile stilize ettik. Umarım beğenirsiniz.</p>
            
        </div>
    </body>
</html>
